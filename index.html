<style>
  :root{
    --navy:#0F172A;
    --midnight:#0B0F19;
    --panel:#111C33;
    --blue:#2563EB;
    --cyan:#38BDF8;
    --ink:#F1F5F9;
    --muted:#94A3B8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--midnight);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .bg-gif{
    position:fixed;inset:0;z-index:-2;
    background:url('background.gif') center center / cover no-repeat;
    filter:blur(8px);
    transform:scale(1.1); /* hides the blurred edge */
  }
  .bg-overlay{
    position:fixed;inset:0;z-index:-1;
    background:rgba(11,15,25,.4);
  }
  main{position:relative;width:100%;max-width:380px;display:none;}

  #loader{
    position:fixed;inset:0;z-index:200;
    background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loader.fade-out{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-logo{
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;
    background:linear-gradient(100deg,var(--ink) 0%, var(--blue) 55%, var(--cyan) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .progress-track{
    width:220px;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
    box-shadow:0 0 12px rgba(56,189,248,.6);
  }
  .progress-percent{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);letter-spacing:.04em;
  }

  .profile{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:40px;}
  .avatar-ring{
    width:96px;height:96px;border-radius:50%;padding:3px;margin-bottom:20px;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
  }
  .avatar-inner{
    width:100%;height:100%;border-radius:50%;background:var(--panel);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .avatar-inner img{width:100%;height:100%;object-fit:cover;display:block;}
  h1{
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;
    background:linear-gradient(100deg,var(--ink) 0%, var(--blue) 55%, var(--cyan) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
  .status-dot{
    width:8px;height:8px;border-radius:50%;background:var(--cyan);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(56,189,248,.55); }
    70%{ box-shadow:0 0 0 8px rgba(56,189,248,0); }
    100%{ box-shadow:0 0 0 0 rgba(56,189,248,0); }
  }

  .links{display:flex;flex-direction:column;gap:14px;}
  .link-card{
    display:flex;align-items:center;gap:16px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(17,28,51,.6);
    border-radius:12px;
    padding:16px 20px;
    text-decoration:none;
    color:inherit;
    transition:all .3s ease;
  }
  .link-card:hover{
    border-color:rgba(56,189,248,.55);
    box-shadow:0 0 0 1px rgba(56,189,248,.15), 0 16px 36px -16px rgba(37,99,235,.5);
    transform:translateY(-3px);
  }
  .icon-box{
    width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .icon-box svg{width:18px;height:18px;stroke:var(--ink);}
  .link-text{flex:1;text-align:left;}
  .link-text .name{display:block;font-weight:600;font-size:14.5px;color:var(--ink);}
  .link-text .handle{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
  .arrow{color:var(--muted);font-size:14px;}

  footer{
    text-align:center;font-size:12.5px;color:var(--muted);margin-top:36px;
  }

  .reveal{
    opacity:0;transform:translateY(14px);
    animation:in .6s ease forwards;
  }
  @keyframes in{ to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
</style>
</head>

<script>
  const loader = document.getElementById('loader');
  const fill = document.getElementById('progressFill');
  const percentLabel = document.getElementById('progressPercent');
  const mainEl = document.querySelector('main');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showMain(){
    loader.classList.add('fade-out');
    mainEl.style.display = 'flex';
    mainEl.style.flexDirection = 'column';
    setTimeout(() => loader.remove(), 550);
  }

  if (reduceMotion){
    showMain();
  } else {
    const duration = 2200; // ms
    const start = performance.now();
    function frame(now){
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic, smooth deceleration
      const pct = eased * 100;
      fill.style.width = pct + '%';
      percentLabel.textContent = Math.floor(pct) + '%';
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        percentLabel.textContent = '100%';
        setTimeout(showMain, 300);
      }
    }
    requestAnimationFrame(frame);
  }
</script>
